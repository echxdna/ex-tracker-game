<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>マスタートル</title>

  <meta name="description" content="EXの出現回数を数えるかめね">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="./images/favicon.png">
  <link rel="apple-touch-icon" href="./images/icon-180.png">

  <link rel="stylesheet" href="./style.css">

  <script>
    // Prevent flash of wrong theme on load
    if (localStorage.getItem('darkMode') === 'true') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>

<body>

  <button id="toggleSidebarBtn" onclick="toggleSidebar()">
    <span class="hamburger">
      <span class="hamburger-line top"></span>
      <span class="hamburger-line middle"></span>
      <span class="hamburger-line bottom"></span>
    </span>
  </button>
  <div id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="sidebarGroup">
      <div class="sidebarGroupTitle">天魔の孤城</div>
      <button class="stageBtn" id="stageBtn0" onclick="selectStage(0)">アーキレット</button>
      <button class="stageBtn" id="stageBtn1" onclick="selectStage(1)">コルティーナ</button>
    </div>
    <div class="sidebarGroup">
      <div class="sidebarGroupTitle">破界の星墓</div>
      <button class="stageBtn" id="stageBtn2" onclick="selectStage(2)">アムネディア</button>
      <button class="stageBtn" id="stageBtn10" onclick="selectStage(10)">インゼムニア</button>
    </div>
    <div class="sidebarGroup">
      <div class="sidebarGroupTitle" onclick="toggleGroup(this)">禁忌の獄(展開▼)</div>
      <div class="sidebarGroupContent collapsed">
        <button class="stageBtn" id="stageBtn4" onclick="selectStage(4)">刹那</button>
        <button class="stageBtn" id="stageBtn5" onclick="selectStage(5)">那由多</button>
        <button class="stageBtn" id="stageBtn6" onclick="selectStage(6)">阿頼耶</button>
        <button class="stageBtn" id="stageBtn7" onclick="selectStage(7)">無量大数</button>
        <button class="stageBtn" id="stageBtn8" onclick="selectStage(8)">涅槃寂静</button>
        <button class="stageBtn" id="stageBtn9" onclick="selectStage(9)">不可思議</button>
      </div>
    </div>
    <div class="sidebarGroup">
      <div class="sidebarGroupTitle">その他</div>
      <button class="stageBtn" id="stageBtn3" onclick="selectStage(3)">自由枠</button>
    </div>
    <div class="toggleRow" style="margin-top: auto;">
      <span class="toggleRowLabel">ダークモード</span>
      <label class="appleToggle" for="switch">
        <input type="checkbox" id="switch" onchange="toggleDarkMode()" />
        <span class="appleToggleTrack"><span class="appleToggleThumb"></span></span>
      </label>
    </div>
    <div class="toggleRow" id="buttonPosRow" style="border-top: none;">
      <span class="toggleRowLabel">下ボタン</span>
      <label class="appleToggle" for="switchButtonPos">
        <input type="checkbox" id="switchButtonPos" onchange="toggleButtonPos()" />
        <span class="appleToggleTrack"><span class="appleToggleThumb"></span></span>
      </label>
    </div>
    <button class="stageBtn danger"
      onclick="if(confirm('消しちゃうんですか...？｡°（´ฅωฅ`）°｡')){localStorage.removeItem('stageTrackerAll'); localStorage.removeItem('stageIndex'); location.reload();}">初期化</button>
    <div class="creditFooter" style="margin-top: 32px;">
      © 2049 TurtleGames Corp.
      <img src="./images/turtle.svg" alt="Turtle"
        style="width: 16px; height: 16px; opacity: 0.6; pointer-events: none;">
    </div>
  </div>

  <div class="mainContent" id="mainContent">

    <h2 id="stageTitle"></h2>

    <div class="layoutSlot" id="slotButtons">
      <div class="buttonGroup">
        <div class="mainButtons">
          <button class="mainButton" onclick="normal()">+1</button>
          <button class="mainButton" onclick="extra()">EX</button>
        </div>
      </div>
    </div>

    <div class="layoutSlot" id="slotStats">
      <div class="panel" id="statsPanel">
        <table class="stats">
          <tr>
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <path
                  d="m12 10 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a8 8 0 1 0-16 0v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3l2-4h4Z" />
                <path d="M4.82 7.9 8 10" />
                <path d="M15.18 7.9 12 10" />
                <path d="M16.93 10H20a2 2 0 0 1 0 4H2" />
              </svg>現在周回</td>
            <td class="stat"><span id="current" class="stat-val"></span><input id="editCurrent" type="text"
                inputmode="numeric" pattern="[0-9]*" class="edit-input"></td>
          </tr>
          <tr>
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <path
                  d="m12 10 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a8 8 0 1 0-16 0v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3l2-4h4Z" />
                <path d="M4.82 7.9 8 10" />
                <path d="M15.18 7.9 12 10" />
                <path d="M16.93 10H20a2 2 0 0 1 0 4H2" />
              </svg>総周回</td>
            <td class="stat"><span id="normalTotal" class="stat-val"></span><input id="editNormal" type="text"
                inputmode="numeric" pattern="[0-9]*" class="edit-input"></td>
          </tr>
          <tr>
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
                <line x1="13" x2="19" y1="19" y2="13" />
                <line x1="16" x2="20" y1="16" y2="20" />
                <line x1="19" x2="21" y1="21" y2="19" />
              </svg>EX出現／敗北</td>
            <td class="stat">
              <span id="exAppearDefeats" class="stat-val"></span>
              <span class="edit-input-group">
                <input id="editExtra" type="text" inputmode="numeric" pattern="[0-9]*" class="edit-input"> /
                <input id="editDefeat" type="text" inputmode="numeric" pattern="[0-9]*" class="edit-input">
              </span>
            </td>
          </tr>
          <tr>
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <path d="M12 10.5a3.5 3.5 0 1 0-3.5-3.5 3.5 3.5 0 0 0 3.5 3.5z" />
                <path d="M13.5 12a3.5 3.5 0 1 0 3.5-3.5 3.5 3.5 0 0 0-3.5 3.5z" />
                <path d="M12 13.5a3.5 3.5 0 1 0 3.5 3.5 3.5 3.5 0 0 0-3.5-3.5z" />
                <path d="M10.5 12a3.5 3.5 0 1 0-3.5 3.5 3.5 3.5 0 0 0 3.5-3.5z" />
              </svg>ラック</td>
            <td class="stat"><span id="rewardTotal" class="stat-val"></span><input id="editReward" type="text"
                inputmode="numeric" pattern="[0-9]*" class="edit-input"></td>
          </tr>
          <tr id="rowDrops" style="display:none">
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <path
                  d="M12 22c6.23-.05 7.87-5.57 7.5-10-.36-4.34-3.95-9.96-7.5-10-3.55.04-7.14 5.66-7.5 10-.37 4.43 1.27 9.95 7.5 10z" />
              </svg>ドロップ</td>
            <td class="stat">
              <span id="dropTotal" class="stat-val"></span>
              <span class="edit-input-group">
                <input id="editDrop1" type="text" inputmode="numeric" pattern="[0-9]*"
                  class="edit-input edit-input-micro"> /
                <input id="editDrop2" type="text" inputmode="numeric" pattern="[0-9]*"
                  class="edit-input edit-input-micro"> /
                <input id="editDrop3" type="text" inputmode="numeric" pattern="[0-9]*"
                  class="edit-input edit-input-micro"> /
                <input id="editDrop4" type="text" inputmode="numeric" pattern="[0-9]*"
                  class="edit-input edit-input-micro"> /
                <input id="editDrop5" type="text" inputmode="numeric" pattern="[0-9]*"
                  class="edit-input edit-input-micro">
              </span>
            </td>
          </tr>
          <tr id="rowShihouLakiriza" style="display:none">
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <rect x="3" y="10" width="18" height="10" rx="1" ry="1" />
                <path d="M3 10c0-3.31 4.03-6 9-6s9 2.69 9 6" />
                <path d="M10 10v4h4v-4" />
              </svg>至宝／ラキリザ</td>
            <td class="stat">
              <span id="shihouLakirizaTotal" class="stat-val"></span>
              <span class="edit-input-group">
                <input id="editShihou" type="text" inputmode="numeric" pattern="[0-9]*" class="edit-input"> /
                <input id="editLakiriza" type="text" inputmode="numeric" pattern="[0-9]*" class="edit-input">
              </span>
            </td>
          </tr>
          <tr>
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <path
                  d="m12 10 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a8 8 0 1 0-16 0v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3l2-4h4Z" />
                <path d="M4.82 7.9 8 10" />
                <path d="M15.18 7.9 12 10" />
                <path d="M16.93 10H20a2 2 0 0 1 0 4H2" />
              </svg>最小／最大</td>
            <td class="stat">
              <span id="minMaxStreak" class="stat-val"></span>
              <span class="edit-input-group">
                <input id="editMin" type="text" inputmode="numeric" pattern="[0-9]*" class="edit-input"> /
                <input id="editMax" type="text" inputmode="numeric" pattern="[0-9]*" class="edit-input">
              </span>
            </td>
          </tr>
          <tr>
            <td class="label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="stat-icon">
                <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
                <line x1="13" x2="19" y1="19" y2="13" />
                <line x1="16" x2="20" y1="16" y2="20" />
                <line x1="19" x2="21" y1="21" y2="19" />
              </svg>EX出現率</td>
            <td class="stat percent" id="rate"></td>
          </tr>
        </table>
      </div>
    </div>

    <div class="edit-controls-wrapper">
      <button id="btnOpenEdit" class="subButton" onclick="openEdit()"><svg xmlns="http://www.w3.org/2000/svg" width="16"
          height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" class="stat-icon" style="margin-right: 4px;">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
        </svg>編集</button>

      <div id="editActionsContainer" class="editActions">
        <button class="subButton" onclick="saveEdit()">保存</button>
        <button class="subButton" onclick="cancelEdit()">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>

</body>

</html>
